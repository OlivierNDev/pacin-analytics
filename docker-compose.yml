version: '3.9'
services:
  api:
    build: .
    ports:
      - '8001:8001'
    environment:
      - DATABASE_URL=postgresql://pacin:pacin@db:5432/pacin_analytics
      - PACIN_ADMIN_TOKEN=dev-admin-token
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pacin
      POSTGRES_PASSWORD: pacin
      POSTGRES_DB: pacin_analytics
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
volumes:
  pgdata:
